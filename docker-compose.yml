version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dtq
      POSTGRES_PASSWORD: dtq
      POSTGRES_DB: dtq
    ports: ["5432:5432"]
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtq"]
      interval: 5s

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  coordinator:
    build: .
    command: ["/app/coordinator"]
    environment:
      DATABASE_URL: postgres://dtq:dtq@postgres:5432/dtq
      REDIS_ADDR: redis:6379
      GRPC_ADDR: ":50051"
      METRICS_ADDR: ":9090"
    ports: ["50051:50051", "9090:9090"]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

  worker:
    build: .
    command: ["/app/worker"]
    environment:
      COORDINATOR_ADDR: coordinator:50051
      WORKER_ID: worker-1
    depends_on: [coordinator]
    deploy:
      replicas: 3

  web:
    build: .
    command: ["/app/web"]
    environment:
      COORDINATOR_ADDR: coordinator:50051
      HTTP_ADDR: ":8080"
    ports: ["8080:8080"]
    depends_on: [coordinator]

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports: ["9091:9090"]

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
